
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WAVE Guyana</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">

        <a href="discover.html" class="logo">WAVE</a>

        <div class="nav-links">
            <a href="discover.html">DISCOVER</a>
            <a href="events.html">EVENTS</a>
            <a href="ideas.html">PARTY IDEAS</a>
        </div>

        <div class="nav-actions">

            <a href="notifications.html" class="notification-button">🔔</a>

            <button class="login-button"
                onclick="window.location.href='login.html'">
                LOG IN
            </button>

        </div>

    </nav>

    <!-- REGISTRATION SECTION -->
    <section class="login-page">

        <h1>WELCOME TO WAVE</h1>

        <p>
            Create your WAVE account and get ready to discover
            unforgettable parties, exciting events and amazing
            experiences across Guyana!
        </p>

        <!-- REGISTRATION FORM -->
        <div class="login-form">

            <form id="registerForm">

                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <!-- PROFILE PICTURE UPLOAD -->
                <label for="profilePicture">Upload Profile Picture</label>

                <input
                    type="file"
                    id="profilePicture"
                    name="profilePicture"
                    accept="image/*"
                    required
    
                >

                <img id="imagePreview" alt="Profile picture preview">
                <label for="registerEmail">Email Address</label>

                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="registerPassword">Create Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit" class="login-submit">
                    CREATE ACCOUNT
                </button>

                <p>
                    Already have an account?
                    <a href="login.html">Log in here</a>
                </p>

            </form>

        </div>

    </section>

</body>
</html>
