
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | WAVE Guyana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="discover.html" class="logo">WAVE</a>

        <div class="nav-links">
            <a href="discover.html">DISCOVER</a>
            <a href="events.html">EVENTS</a>
            <a href="ideas.html">PARTY IDEAS</a>
        </div>

        <div class="nav-actions">
            <a href="login.html" class="admin-nav-link">MEMBER LOGIN</a>
        </div>
    </nav>

    <section class="admin-login-page">

        <div class="admin-login-card">

            <span class="admin-label">WAVE MANAGEMENT</span>

            <h1>ADMIN LOGIN</h1>

            <p>
                Authorized personnel only.
                Sign in to access the WAVE management dashboard.
            </p>

            <form action="admin.html">

                <label for="adminEmail">Administrator Email</label>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter administrator email"
                    required
                >

                <label for="adminPassword">Password</label>
                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="login-submit">
                    ACCESS DASHBOARD
                </button>

            </form>

            <a href="discover.html" class="back-link">
                ← BACK TO WAVE
            </a>

        </div>

    </section>

</body>
</html>
